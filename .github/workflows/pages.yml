name: Pages
# Publishes site/ (landing, privacy policy, support) to GitHub Pages.
# One-time: repo Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/store-icon-512.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          cp assets/store-icon-512.png site/icon.png
          if grep -rl 'SUPPORT_EMAIL' site; then
            echo "::error::Replace SUPPORT_EMAIL placeholders in site/ before publishing"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
